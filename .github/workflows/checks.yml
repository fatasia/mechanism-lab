name: Public-source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/requirements.lock.txt
      - run: python -m pip install -r code/python/requirements.lock.txt
      - run: python -m pip install --no-deps -e code/python
      - run: python -m pytest code/python/tests -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/ts/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/ts/demo/package-lock.json
      - run: npm ci
      - run: npm run build
